<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>行动勇者 · 一个会生长的世界</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 登录 / 注册视图 ===== -->
  <div id="authView" class="auth-view" hidden>
    <main class="auth-card">
      <h1>⚔️ 行动勇者</h1>
      <p class="auth-sub">你的现实生活，是这个世界的养分</p>

      <form id="authForm">
        <input id="authEmail" type="email" placeholder="邮箱" required autocomplete="email">
        <input id="authPassword" type="password" placeholder="密码（至少 6 位）" required autocomplete="current-password" minlength="6">
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">登录</button>
      </form>

      <button id="authToggle" class="btn btn-link">还没有账号？注册</button>
      <button id="diagBtn" type="button" class="btn btn-link">🔍 检测网络连接</button>
      <p id="authMsg" class="log"></p>
    </main>
  </div>

  <!-- ===== 主应用视图 ===== -->
  <div id="appView" hidden>
    <header class="topbar">
      <span class="brand">⚔️ 行动勇者</span>
      <div class="topbar-actions">
        <button id="printerBtn" class="btn btn-small">🖨️ <span id="printerState">未连接</span></button>
        <button id="settingsBtn" class="btn btn-small">⚙️</button>
      </div>
    </header>

    <main class="content">
      <!-- 勇者之路：任务 -->
      <section id="view-tasks" class="view"></section>
      <!-- 伙伴 -->
      <section id="view-companion" class="view" hidden></section>
      <!-- 王国：领地 + 图鉴 -->
      <section id="view-world" class="view" hidden></section>
      <!-- 编年史：日记 / 复盘 -->
      <section id="view-chronicle" class="view" hidden></section>
      <!-- 贤者之书：答案之书 -->
      <section id="view-oracle" class="view" hidden></section>
      <!-- 设置 -->
      <section id="view-settings" class="view" hidden></section>
    </main>

    <nav class="tabbar">
      <button class="tab" data-view="tasks">🧭<span>勇者</span></button>
      <button class="tab" data-view="companion">🐣<span>伙伴</span></button>
      <button class="tab" data-view="world">🏰<span>王国</span></button>
      <button class="tab" data-view="chronicle">📜<span>编年史</span></button>
      <button class="tab" data-view="oracle">🔮<span>贤者书</span></button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
